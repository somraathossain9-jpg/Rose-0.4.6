name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find the project folder
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts | head -n 1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rose-apk
          path: '**/build/outputs/apk/debug/*.apk'

      - name: Put the APK on the Releases page
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find . -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          gh release create "build-${{ github.run_number }}" "$apk" \
            --title "Rose build ${{ github.run_number }}" \
            --notes "Auto build from commit ${GITHUB_SHA::7}" \
            --prerelease --target "$GITHUB_SHA"

      - name: Unit tests
        continue-on-error: true
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rose-test-report
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
